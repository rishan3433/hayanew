<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haya Agencies</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <div class="screen">
        <div class="head">
            <div class="appbar">
                <div class="leftbar">
                    <img src="css/asset/images/Haya Agencies Logo.png" alt="Haya Agencies" srcset="" class="HayaLogo">
                    <h3>HAYA AGENCIES</h3>
                </div>
                <div class="navigation">
                    <ul class="nav-ul">
                        <div onclick="CloseSide()" class="closebtn"><img src="css/asset/images/CLOSE.png" alt="Close"
                                srcset=""></div>
                        <div class="space"><a href="#"></a></div>
                        <li class="home"><a href="#">Home</a></li>
                        <li><a href="">Products</a></li>
                        <li><a href="">Contact Us</a></li>
                        <li><a href="">Accounts</a></li>
                    </ul>
                </div>
                <div class="navigation-btn">
                    <ul style="list-style: none;">
                        <li onclick="ShowSide()"><img src="css/asset/images/3 menu.png" alt="" id="clickbtn"
                                class="clickbtn"></li>
                    </ul>
                </div>
            </div>
            
        </div>

    </div>

    <div class="body">
        <section class="section">
            <div class="slider-wrapper">
                <div class="slider">
                    <div class="slider-img">
                        <img id="slide-1" src="css/asset/images/Products/Nestle/1.png" alt="Nescafe Classic 500g">
                        <img id="slide-2" src="css/asset/images/Products/Nestle/2.png" alt="Nestae Cardamon Tea">
                        <img id="slide-3" src="css/asset/images/Products/Nestle/3.png" alt="Nestea Iced Tea Lemon">
                        <img id="slide-4" src="css/asset/images/Products/Nestle/4.png" alt="Nescafe Sunrise 1 kg">
                        <img id="slide-5" src="css/asset/images/Products/Nestle/5.png" alt="EVERYDAY Milk Powder 1 KG">
                        <img id="slide-6" src="css/asset/images/Products/tata/1.png" alt="Tata Grand Coffee 1kg">
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="javascript/script.js">

    </script>
</body>

</html>
